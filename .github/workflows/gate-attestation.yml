# WHY this caller replaces the trailer-only gate: a PR without access to the
# private Kanon gate could never mint a Gate-Passed trailer, so the old check
# was an unsatisfiable policy rather than verification. The fleet hybrid
# gate keeps a real trailer as a fast-path receipt and runs the commands below
# for every untrailered change. Its terminal `gate / gate` job reports on every
# path, including failures in preflight jobs.
name: Gate Attestation

on:
  # WHY no base-branch filter: stacked PRs have a feature branch as their base.
  # Filtering for main would give them no gate run rather than a failed one.
  pull_request:
  # WHY verify main: a squash or rebase produces a tree that no source-branch
  # trailer attested. The reusable therefore always runs the real commands on a
  # default-branch push, independent of trailer state.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # WHY @main: forkwright/.github publishes no tags, so a SHA has no automated
    # refresh path and silently freezes. This is first-party fleet CI in the same
    # trust boundary; the reusable owns mechanism and this caller owns only the
    # repository-specific commands.
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      # rust_toolchain is intentionally omitted (reusable default ""): the
      # reusable's setup-rust-toolchain step reads rust-toolchain.toml, which
      # keeps the toolchain pin in one file.

      # WHY --all-features: later slices add feature-gated code (the daemon's
      # failpoints feature). A default-features gate would never compile it.
      # These strings match the local gate in CLAUDE.md and .kanon-ci.toml.
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --workspace --all-targets --all-features"
      clippy_cmd: "cargo clippy --workspace --all-targets --all-features -- -D warnings"
      nextest_cmd: "cargo nextest run --workspace --all-features"
      doctest_cmd: "cargo test --workspace --doc --all-features"

      # The specification-corpus checks moved to docs.yml (job `docs`), which
      # runs on every PR. The private Kanon stages (`kanon lint --workflow`,
      # `kanon lint --writing README.md`, and the manifest writing pass) remain
      # authoritative in .kanon-ci.toml and are not claimed by this gate.

      # WHY true now that a Cargo workspace exists: a docs-only diff (*.md,
      # docs/**, llms.txt) cannot change what cargo builds, and docs.yml runs
      # the corpus checks on every PR. The exemption is only sound while
      # branch protection requires the `docs` context next to `gate / gate`;
      # without it a docs-only PR merges on a gate that verified nothing.
      docs_only_exemption: true
      ai_attribution_check: true
      needs_fleet_repo_token: false
      rust_cache_key: "dioptron-gate"
