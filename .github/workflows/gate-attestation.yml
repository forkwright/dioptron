# WHY this caller replaces the trailer-only gate: a PR without access to the
# private Kanon gate could never mint a Gate-Passed trailer, so the old check
# was an unsatisfiable policy rather than verification. The fleet hybrid
# gate keeps a real trailer as a fast-path receipt and runs the commands below
# for every untrailered change. Its terminal `gate / gate` job reports on every
# path, including failures in preflight jobs.
name: Gate Attestation

on:
  # WHY no base-branch filter: stacked PRs have a feature branch as their base.
  # Filtering for main would give them no gate run rather than a failed one.
  pull_request:
  # WHY verify main: a squash or rebase produces a tree that no source-branch
  # trailer attested. The reusable therefore always runs the real commands on a
  # default-branch push, independent of trailer state.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # WHY @main: forkwright/.github publishes no tags, so a SHA has no automated
    # refresh path and silently freezes. This is first-party fleet CI in the same
    # trust boundary; the reusable owns mechanism and this caller owns only the
    # repository-specific commands.
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      # Dioptron has no toolchain file or Cargo workspace. The reusable currently
      # installs its Rust runner substrate unconditionally, so name the toolchain
      # it needs rather than relying on implicit hosted-runner state.
      rust_toolchain: stable

      # The reusable's four mandatory command slots retain Rust-era names. None
      # is a no-op here: together they project every deterministic check that can
      # run without the private Kanon binary from .kanon-ci.toml and its scripts.
      fmt_cmd: >-
        python3 -m py_compile
        ci/check-doc-refs.py
        ci/check-doc-manifest.py
      check_cmd: "ci/check-doc-refs.py ."
      clippy_cmd: "ci/check-doc-manifest.py --structure-only ."
      nextest_cmd: "ci/check-doc-manifest.py --self-test --structure-only"

      # The private stages are deliberately absent, not silently translated:
      # `kanon lint --workflow`, `kanon lint --writing README.md`, and the
      # manifest-derived writing pass remain authoritative in .kanon-ci.toml.

      # WHY false: the specification corpus is the product in this design phase.
      # A docs-only PR should be able to pass without a private trailer, but it
      # must still run the lightweight reference and manifest checks above.
      docs_only_exemption: false

      # WHY empty: there is no Cargo workspace and no executable Rust doctest
      # corpus. Unlike the four commands above, this optional slot is structurally
      # inapplicable until implementation crates land.
      doctest_cmd: ""
      needs_fleet_repo_token: false
      rust_cache_key: "dioptron-docs-gate"
