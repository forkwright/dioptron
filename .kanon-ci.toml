# archetype: B
# forge-only: false
# spdx: AGPL-3.0-or-later

# Dioptron CI pipeline.
#
# Dioptron is docs-only today (design phase) - no Cargo.toml, no crates,
# nothing for the default Rust gate to exercise. The docs-phase gate
# keeps the forge post-receive hook honest with real checks that do not
# require a Rust workspace.
#
# WHY the specification corpus is in the gate and not just README: at this
# phase the corpus is the product, so leaving it outside CI is equivalent to
# leaving product source outside CI. The validated set is derived from
# docs/MANIFEST.toml rather than listed here, so a new canonical document
# cannot be added without also being validated -- see ci/check-doc-manifest.py.
#
# GitHub's public hybrid gate projects the mechanically public subset through
# `py_compile`, `check-doc-refs.py`, and `check-doc-manifest.py --structure-only`:
# Python syntax, identifier references, manifest completeness,
# and negative structural fixtures. The two Kanon-owned judgments below
# (`ci-config-lint`, `readme-lint`) and the manifest writing pass remain
# forge-only because the Kanon binary is private. Do not replace them with hosted
# no-ops or a second writing linter; the full forge pipeline remains the authority
# for those claims.
#
# When dioptron grows the `crates/` workspace described in
# docs/design/topology.md, replace `pipeline.stages` with the full Rust
# gate:
#
#     stages = ["cargo fmt", "cargo check", "cargo clippy", "cargo nextest", "kanon lint"]
#
# Those stage names resolve against the default-Rust-gate catalog in
# archeion::ci_config, so no [stages.<name>] blocks are required at that
# point either.

[pipeline]
stages = [
    "ci-config-lint",
    "readme-lint",
    "doc-refs-check",
    "docs-manifest-check",
    "docs-manifest-selftest",
]

[stages.ci-config-lint]
cmd = "kanon lint --workflow .kanon-ci.toml"
timeout_secs = 30

[stages.readme-lint]
cmd = "kanon lint --writing README.md"
timeout_secs = 30

[stages.doc-refs-check]
cmd = "ci/check-doc-refs.py ."
timeout_secs = 30

[stages.docs-manifest-check]
cmd = "ci/check-doc-manifest.py ."
timeout_secs = 60

# WHY this stage is separate from docs-manifest-check: the check above passes
# on the corpus as it stands, and a stage that has never failed is not evidence
# that it can. This one replays negative fixtures -- an unlisted document, a
# deleted document, an invalid change to a canonical requirement -- and fails
# if any of them is not caught. It is the docs-phase counterpart to the
# independent verifier disabled below.
[stages.docs-manifest-selftest]
cmd = "ci/check-doc-manifest.py --self-test"
timeout_secs = 60

# The 03f-e independent verifier replays the main pipeline's claims
# (clippy warning count, lint violation count, build success) in a
# fresh worktree. Dioptron still has no Cargo workspace, so the
# verifier's default build probe (`cargo check --all-features --tests`)
# fails structurally and flags a false divergence. Disable the verifier
# here; re-enable when the pipeline grows real Rust stages for it to
# reproduce.
[verifier]
enabled = false
