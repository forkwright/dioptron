# archetype: B
# forge-only: false
# spdx: LicenseRef-PolyForm-Noncommercial-1.0.0

# Dioptron local Kanon recipe.
#
# The Rust workspace under crates/ landed with the Phase 01 S2 implementation
# kickoff, so the pipeline runs the full Rust gate first and keeps the
# specification-corpus stages after it. This file records the checks for an
# environment where the private Kanon binary is installed. It is not the
# GitHub workflow or an independently reported merge verdict.
#
# WHY explicit cargo stage blocks rather than the default-Rust-gate catalog:
# the catalog commands omit --all-features and the doctest pass. The commands
# below match .github/workflows/gate-attestation.yml and CLAUDE.md so a
# Gate-Passed trailer and a green hosted gate attest the same stages.
#
# WHY the specification corpus stays in the gate: the corpus remains part of
# the product, and the validated set is derived from docs/MANIFEST.toml rather
# than listed here, so a new canonical document cannot be added without also
# being validated -- see ci/check-doc-manifest.py.
#
# GitHub Actions is the active pull-request verifier. The hybrid gate
# (`gate / gate`) runs the cargo stages; docs.yml (`docs`) runs `py_compile`,
# `check-doc-refs.py`, and `check-doc-manifest.py --structure-only` with its
# negative fixtures. The Kanon-owned judgments below (`kanon lint`,
# `ci-config-lint`, `readme-lint`) and the manifest writing pass are available
# only to a caller that has Kanon installed. GitHub does not claim them, and a
# green hosted gate is not evidence that they ran. Do not replace them with
# hosted no-ops or a second writing linter.

[pipeline]
stages = [
    "cargo fmt",
    "cargo check",
    "cargo clippy",
    "cargo nextest",
    "cargo doctest",
    "kanon lint",
    "ci-config-lint",
    "readme-lint",
    "doc-refs-check",
    "docs-manifest-check",
    "docs-manifest-selftest",
]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 120

[stages."cargo check"]
cmd = "cargo check --workspace --all-targets --all-features"
timeout_secs = 600

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
timeout_secs = 900

[stages."cargo nextest"]
cmd = "cargo nextest run --workspace --all-features"
timeout_secs = 1800

# WHY a separate stage: nextest does not run doctests.
[stages."cargo doctest"]
cmd = "cargo test --workspace --doc --all-features"
timeout_secs = 600

[stages."kanon lint"]
cmd = "kanon lint . --summary"
timeout_secs = 300

[stages.ci-config-lint]
cmd = "kanon lint --workflow .kanon-ci.toml"
timeout_secs = 30

[stages.readme-lint]
cmd = "kanon lint --writing README.md"
timeout_secs = 30

[stages.doc-refs-check]
cmd = "ci/check-doc-refs.py ."
timeout_secs = 30

[stages.docs-manifest-check]
cmd = "ci/check-doc-manifest.py ."
timeout_secs = 60

# WHY this stage is separate from docs-manifest-check: the check above passes
# on the corpus as it stands, and a stage that has never failed is not evidence
# that it can. This one replays negative fixtures -- an unlisted document, a
# deleted document, an invalid change to a canonical requirement -- and fails
# if any of them is not caught. It tests the recipe's own structural claims; it
# is not an independent verifier.
[stages.docs-manifest-selftest]
cmd = "ci/check-doc-manifest.py --self-test"
timeout_secs = 60

# WHY still disabled: the generic 03f-e verifier's build probe
# (`cargo check --all-features --tests`) can now run against this workspace,
# but no Kanon verifier run has reproduced this recipe yet, and enabling it
# changes the merge policy. GitHub's exact-head `gate / gate` result is the
# current verifier; enable a Kanon verifier only after a recorded run shows
# its claims reproduce on this workspace and the operator approves the
# merge-policy change.
[verifier]
enabled = false
