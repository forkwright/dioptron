# archetype: B
# forge-only: false
# spdx: AGPL-3.0-or-later

# Dioptron CI pipeline.
#
# Dioptron is docs-only today (design phase) - no Cargo.toml, no crates,
# nothing for the default Rust gate to exercise. The docs-phase gate
# keeps the forge post-receive hook honest with real checks that do not
# require a Rust workspace: lint this CI file and the public README.
#
# When dioptron grows the `crates/` workspace described in
# docs/design/topology.md, replace `pipeline.stages` with the full Rust
# gate:
#
#     stages = ["cargo fmt", "cargo check", "cargo clippy", "cargo nextest", "kanon lint"]
#
# Those stage names resolve against the default-Rust-gate catalog in
# archeion::ci_config, so no [stages.<name>] blocks are required at that
# point either.

[pipeline]
stages = ["ci-config-lint", "readme-lint", "doc-refs-check"]

[stages.ci-config-lint]
cmd = "kanon lint --workflow .kanon-ci.toml"
timeout_secs = 30

[stages.readme-lint]
cmd = "kanon lint --writing README.md"
timeout_secs = 30

[stages.doc-refs-check]
cmd = "ci/check-doc-refs.py ."
timeout_secs = 30

# The 03f-e independent verifier replays the main pipeline's claims
# (clippy warning count, lint violation count, build success) in a
# fresh worktree. Dioptron still has no Cargo workspace, so the
# verifier's default build probe (`cargo check --all-features --tests`)
# fails structurally and flags a false divergence. Disable the verifier
# here; re-enable when the pipeline grows real Rust stages for it to
# reproduce.
[verifier]
enabled = false
