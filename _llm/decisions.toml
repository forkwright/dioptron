[meta]
name = "dioptron"
repo = "forkwright/dioptron"
generated = false
source_docs = [
  "CLAUDE.md",
  "docs/design/decisions.md",
  "docs/design/zetesis-acquisition-boundary.md",
  "<canonical-state-doc>/STATE.md",
]

[decisions]
summary = "Locked decisions for the dioptron sovereign web runtime specification."

[[decision]]
id = "D-peer-tenancy"
title = "Operator and agents are peer tenants"
status = "accepted"
context = "Human UI and agent access must not fork into privileged and second-class capability stacks."
decision = "Model operator, agents, and sub-agents as tenants whose differences are grants, not capabilities."
consequences = "Every capability is exposed once through the canonical surface."

[[decision]]
id = "D-rust-trait-surface"
title = "Canonical Rust trait over local transports"
status = "accepted"
context = "The runtime needs an agent- and UI-consumable interface without webview-only assumptions."
decision = "Expose the primary interface as Rust traits over unix socket and plegma-quic."
consequences = "Desktop UI is just another client, and agents can consume the same verbs."

[[decision]]
id = "D-three-band-topology"
title = "Engine, instrument, operations, and tenancy"
status = "accepted"
context = "The browser-like substrate needs core web, knowledge acquisition, action, and tenant policy separated."
decision = "Use three bands across eleven layers plus cross-cutting tenancy."
consequences = "Implementation slices can start with D2 net, D5 store, and D12 tenancy without losing the full model."

[[decision]]
id = "D-blitz-render-floor"
title = "Use blitz render primitives as D3 foundation"
status = "accepted"
context = "Render foundation needed evaluation across Servo, Verso, Blitz, Gosub, and lower-level text/render stacks."
decision = "Use blitz-dom, blitz-html, and blitz-traits with Vello, omitting blitz-shell."
consequences = "Dioptron owns windowing/event loop while keeping an embeddable Rust render foundation."

[[decision]]
id = "D-pure-rust-render-lock"
title = "Lock pure-Rust rendering with no C++ fallback"
status = "locked"
context = "The project needed to resolve whether v1 allowed a Chromium or native-browser fallback for origins that defeat native rendering."
decision = "No Chromium, headless-browser, or C++ rendering fallback enters the workspace. D3 native Rust rendering is the only supported render path."
consequences = "Origins that fail native rendering become native parity gaps. The v1 daily-driver target yields to the sovereignty invariant when the two conflict."

[[decision]]
id = "D-render-evidence-floor"
title = "Measure rendering completeness with an operator corpus"
status = "accepted"
context = "D17.9 requires a measurable operator top-1000 rendering floor before render-band code can claim completeness."
decision = "Use a versioned operator top-1000 origin corpus, deterministic capture protocol, severity taxonomy, immutable evidence bundles, and native-gap tracking as the render-completeness contract."
consequences = "Render-band implementation cannot redefine success after the fact; failing origins remain native parity work under the pure-Rust lock."

[[decision]]
id = "D-script-band-v1-scope"
title = "Evaluate D4 as v1 dynamic extraction scope"
status = "accepted"
context = "The v1 product scope includes world-monitor behavior with first-order intelligence, which requires dynamic extraction coverage for scripted pages."
decision = "D4 is in v1 scope, with mozjs, rusty_v8, and limited/no-JS evaluated against sovereignty, sandboxability, DOM binding cost, Web API coverage, unsafe/vendor audit, and maintenance cost."
consequences = "Limited/no-JS can be an early phase but not the final D4 answer; Chromium and headless-browser fallbacks remain excluded."

[[decision]]
id = "D-ops-sandbox"
title = "Sandbox operations per verb"
status = "accepted"
context = "Active web operations can cross security boundaries."
decision = "Use landlock+seccomp per verb and a dedicated network namespace for exploit-runner behavior."
consequences = "Operational capability remains explicit and auditable."

[[decision]]
id = "D-zetesis-static-acquisition-boundary"
title = "Consume one Zetesis static acquisition mechanism"
status = "accepted"
context = "A Dioptron-local static fetch stack would duplicate target, redirect, HTTP, decompression, extraction, and evidence behavior."
decision = "Keep invocation authority and product context in Dioptron while Zetesis owns the consumer-neutral static acquisition state machine and evidence envelope."
consequences = "The design-only adapter reserves authority and records intent before invocation, stores the Zetesis envelope verbatim with Dioptron identities, and settles or releases afterward. Dependency work waits for a Kanon-derived immutable producer SHA and a real compatibility test."
