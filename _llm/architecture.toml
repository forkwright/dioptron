[meta]
name = "dioptron"
repo = "forkwright/dioptron"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "docs/design/topology.md",
  "docs/design/zetesis-acquisition-boundary.md",
  "<canonical-state-doc>/STATE.md",
]

[architecture]
summary = "Specification-stage sovereign web runtime where operator and agents share one peer-tenanted capability surface for browsing, ingest, querying, and action."
layers = [
  "engine-net",
  "engine-render",
  "engine-script",
  "engine-store",
  "engine-identity",
  "instrument-ingest",
  "instrument-rules",
  "instrument-session",
  "instrument-ui",
  "operations",
  "tenancy",
]

[[architecture.crates]]
name = "crates"
path = "crates"
role = "TBD implementation crates for the 11-layer topology; no Rust code has landed yet."

[[interfaces]]
name = "canonical capability trait"
kind = "rust-trait"
path = "docs/design/tenancy.md"

[[interfaces]]
name = "Zetesis static acquisition"
kind = "cross-repository-adapter"
path = "docs/design/zetesis-acquisition-boundary.md"
producer = "forkwright/zetesis"
consumer = "forkwright/dioptron"
status = "design-only"
contract = "Dioptron authorizes and persists invocation context. Zetesis owns validated targets, redirect proof, bounded HTTP and decompression, static extraction, and the evidence envelope."
