[meta]
name = "dioptron"
repo = "forkwright/dioptron"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "docs/design/topology.md",
  "docs/design/zetesis-acquisition-boundary.md",
  "<canonical-state-doc>/STATE.md",
]

[architecture]
summary = "Phase 01 implementation-stage sovereign web runtime where operator and agents share one peer-tenanted capability surface for browsing, ingest, querying, and action."
layers = [
  "engine-net",
  "engine-render",
  "engine-script",
  "engine-store",
  "engine-identity",
  "instrument-ingest",
  "instrument-rules",
  "instrument-session",
  "instrument-ui",
  "operations",
  "tenancy",
]

[[architecture.crates]]
name = "syntheke"
path = "crates/syntheke"
role = "Capability contract: wire schema, identifiers, capabilities, modes, outcome taxonomy. The only crate consumers link. Skeleton."

[[architecture.crates]]
name = "epitrope"
path = "crates/epitrope"
role = "Authorization without IO: grant narrowing, chain validity with revocations, budgets, invocation transitions, dry-run planning. Skeleton."

[[architecture.crates]]
name = "phylake"
path = "crates/phylake"
role = "D5 custody store: encrypted transactional persistence of grants, invocations, artifacts, and audit. Skeleton."

[[architecture.crates]]
name = "dioptron"
path = "crates/dioptron"
role = "Daemon binary and library: orchestrator, producer seam, local socket server. Contains no HTTP, DNS, or extraction code. Skeleton."

[[architecture.crates]]
name = "xenos"
path = "crates/xenos"
role = "Independent wire client (publish = false) linking only syntheke, for process-level acceptance tests. Skeleton."

[[interfaces]]
name = "canonical capability trait"
kind = "rust-trait"
path = "docs/design/tenancy.md"

[[interfaces]]
name = "Zetesis static acquisition"
kind = "cross-repository-adapter"
path = "docs/design/zetesis-acquisition-boundary.md"
producer = "forkwright/zetesis"
consumer = "forkwright/dioptron"
status = "design-only"
contract = "Dioptron authorizes and persists invocation context. Zetesis owns validated targets, redirect proof, bounded HTTP and decompression, static extraction, and the evidence envelope."
