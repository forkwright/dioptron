[workspace]
# WHY resolver 3: MSRV-aware resolution keeps new dependencies within
# rust-version below.
resolver = "3"
members = [
    "crates/syntheke",
    "crates/epitrope",
    "crates/phylake",
    "crates/dioptron",
    "crates/xenos",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
# WHY 1.97 and not the edition floor (1.85): the MSRV claims only what CI
# builds. The gate runs the rust-toolchain.toml channel (1.97.1) and no
# separate MSRV job exists, so a lower value would be an untested promise.
# fjall 3, the planned storage dependency, already requires 1.90.
rust-version = "1.97"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/forkwright/dioptron"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# NOTE: missing_docs is denied per library crate with #![deny(missing_docs)]
# (kanon RUST.md), which leaves binary targets exempt.

[workspace.lints.clippy]
# Style
pedantic = { level = "warn", priority = -1 }

# Safety: zero tolerance
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"
as_conversions = "warn"
arithmetic_side_effects = "warn"
string_slice = "warn"

# Quality: zero tolerance
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
missing_assert_message = "deny"
tests_outside_test_module = "deny"

# Quality: warnings (sometimes justified with #[expect])
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
map_err_ignore = "warn"
match_wildcard_for_single_variants = "warn"
needless_for_each = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
string_add = "warn"
trait_duplication_in_bounds = "warn"
# NOTE: the kanon RUST.md sample spells this `trivially_copy_passable_by_ref`,
# which clippy rejects as unknown (and unknown_lints ignores -D warnings).
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
inefficient_to_string = "warn"

# NOTE: each implementation slice declares the dependencies it introduces,
# with its justification, in the same change.
[workspace.dependencies]
# WHY rkyv: docs/design/topology.md fixes rkyv as the wire format; 0.8 with
# bytecheck validates an archive before any field is read. The format
# features are named explicitly so a crate enabling a conflicting format
# (big endian, other pointer width) fails the build instead of changing the
# wire layout.
rkyv = { version = "0.8.18", default-features = false, features = [
    "std",
    "bytecheck",
    "little_endian",
    "aligned",
    "pointer_width_32",
] }
# WHY snafu: the fleet error library (kanon RUST.md); thiserror is banned.
snafu = "0.9.2"
# WHY toml (dev only): the contract fixtures are TOML files that the
# syntheke conformance test parses.
toml = "1.1.6"
# WHY one RustCrypto generation: chacha20poly1305 0.11 (aead 0.6), hkdf
# 0.13, hmac 0.13, and sha2 0.11 all sit on digest 0.11, crypto-common
# 0.2, and hybrid-array 0.4, so the tree holds one copy of each trait
# crate (deny.toml bans duplicate versions). ed25519-dalek 3.0 depends on
# sha2 0.11 and rand_core 0.10, the same generation.
# WHY `zeroize` features: the cipher, HMAC, and hash states copy key
# material into their own structs; these features zero that copy on drop.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# WHY direct: the one OS random source for keys, salts, and nonces. 0.4 is
# the version crypto-common 0.2 and ed25519-dalek 3 use.
getrandom = { version = "0.4", default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", features = ["zeroize"] }
# WHY rustix: opening the root key file with O_NOFOLLOW | O_NONBLOCK and
# reading the effective uid need flags and a syscall that std exposes only
# through raw `libc` constants or unsafe calls. rustix wraps both in safe
# functions and is already in the lock file (tempfile depends on it), so it
# adds no new crate version.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
secrecy = "0.10"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
tempfile = "3"
zeroize = "1.8"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
