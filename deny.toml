# cargo-deny configuration.
#
# Advisory ignores live here only. `.cargo/audit.toml` and
# `osv-scanner.toml` are derived from this list (kanon SUPPLY-CHAIN.md).

[graph]
targets = []
# WHY true: the gate builds with --all-features, so feature-gated
# dependencies must pass the same license, ban, and advisory checks.
all-features = true

[advisories]
ignore = []

[licenses]
# WHY this list: the workspace's own license plus what current dependencies
# need; cargo-deny warns on allowances no crate uses. Each implementation
# slice adds the licenses its new dependencies need, with the dependency
# that needs them.
# - MIT, Apache-2.0: rkyv and its support crates (MIT), the RustCrypto
#   crates, secrecy, zeroize, snafu, toml, getrandom, tempfile, rustix,
#   fjall and its storage crates, and their build dependencies (all offer
#   MIT or Apache-2.0).
# - BSD-3-Clause: ed25519-dalek, curve25519-dalek, and subtle (Ed25519
#   tenant authentication: the daemon verifies, xenos signs).
# - Unicode-3.0: unicode-ident, via proc-macro2 under snafu-derive.
# - 0BSD: varint-rs, the key-length encoding inside lsm-tree (under fjall).
# - BSL-1.0: xxhash-rust, the checksum inside fjall and lsm-tree.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
# WHY: lets a publish = false crate (xenos) take path dependencies without a
# version. Publishable crates still pin internal dependencies by version,
# declared once in [workspace.dependencies].
allow-wildcard-paths = true
# WHY: the ecosystem is mid-migration from syn 2 to syn 3. rkyv_derive
# 0.8.18, bytecheck_derive 0.8.3, and ptr_meta_derive 0.3.2 use syn 3; the
# latest snafu-derive (0.9.2), munge_macro (0.4.7, inside rkyv), and
# curve25519-dalek-derive (0.1.1, under ed25519-dalek 3) still use syn 2.
# tokio-macros 2.7 uses syn 3. Both copies are proc-macro build
# dependencies and never reach a built artifact. The one way to a single syn is holding rkyv at 0.8.17 with
# bytecheck 0.8.2 and ptr_meta 0.3.1, which pins the wire validator below
# its current release to dedupe a build tool; rejected. Retire this entry
# when snafu-derive, munge_macro, and curve25519-dalek-derive release on
# syn 3.
#
# WHY hashbrown: three copies meet in the custody store and none can be
# aligned from this workspace. rkyv 0.8.18 (the wire format, syntheke)
# requires hashbrown 0.17 through its `alloc` feature; fjall 3.1 depends on
# dashmap 6, which requires hashbrown 0.14; lsm-tree 3.1 (inside fjall)
# requires quick_cache 0.6, whose newest release requires hashbrown 0.16.
# No fjall 3 release uses a newer dashmap or quick_cache, and holding rkyv
# back would pin the wire validator below its current release. The copies
# are ordinary hash-table code with no shared types across the boundary.
# Retirement: the 0.16 entry retires when lsm-tree moves to quick_cache 0.7,
# which already uses hashbrown 0.17. The 0.14 entry retires when fjall's
# concurrent map reaches hashbrown 0.17; leaving dashmap 6 alone is not
# enough, because the dashmap 7 release candidates use hashbrown 0.15, so
# that move turns this entry into a 0.15 entry rather than removing it.
skip = [
    { crate = "syn@2", reason = "proc-macro build dependency; snafu-derive, munge_macro, and curve25519-dalek-derive have no syn 3 release yet" },
    { crate = "hashbrown@0.14", reason = "dashmap 6 under fjall 3.1; retire when fjall's map dependency is on hashbrown 0.17 (dashmap 7 rc uses 0.15)" },
    { crate = "hashbrown@0.16", reason = "quick_cache 0.6 under lsm-tree 3.1; retire when lsm-tree moves to quick_cache 0.7 (hashbrown 0.17)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
