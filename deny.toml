# cargo-deny configuration.
#
# Advisory ignores live here only. `.cargo/audit.toml` and
# `osv-scanner.toml` are derived from this list (kanon SUPPLY-CHAIN.md).

[graph]
targets = []
# WHY true: the gate builds with --all-features, so feature-gated
# dependencies must pass the same license, ban, and advisory checks.
all-features = true

[advisories]
ignore = []

[licenses]
# NOTE: cargo-deny warns on allowances no crate uses, so each
# implementation slice adds the licenses its new dependencies need, with the
# dependency that needs them.
allow = [
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
    # rkyv, bytecheck, rancor, snafu, serde, toml, and their build deps.
    "MIT",
    "Apache-2.0",
    # ed25519-dalek, curve25519-dalek, and subtle (Ed25519 tenant
    # authentication).
    "BSD-3-Clause",
    # unicode-ident, a proc-macro build dependency.
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
# WHY: lets a publish = false crate (xenos) take path dependencies without a
# version. Publishable crates still pin internal dependencies by version,
# declared once in [workspace.dependencies].
allow-wildcard-paths = true
# WHY: the ecosystem is mid-migration from syn 2 to syn 3. rkyv_derive and
# bytecheck_derive use syn 3 while snafu-derive and munge_macro (inside
# rkyv) still use syn 2. Both copies are proc-macro build dependencies and
# never reach a built artifact. Drop this entry once snafu and munge move
# to syn 3.
skip = [
    { crate = "syn@2", reason = "proc-macro build dependency split across syn 2 and syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
